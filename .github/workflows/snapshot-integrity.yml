name: Publication snapshot integrity

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Compile validation scripts
        run: >-
          python -m compileall -q
          experiments
          verify_publication_snapshot.py
          verify_reproduced_results.py
          verify_release_validation_record.py
      - name: Verify committed publication snapshot
        run: python verify_publication_snapshot.py
      - name: Exercise reproduced-results verifier on committed analytical snapshot
        run: >-
          python verify_reproduced_results.py
          --results-dir results
          --expected-version 0.1.0a1
          --benchmark-repetitions 3
      - name: Verify stable v0.1.0 release-validation record
        run: |
          python verify_release_validation_record.py \
            --record-dir release_validation/v0.1.0 \
            --expected-version 0.1.0 \
            --expected-production-commit 71b055bdbd8e00ee63afda136b88892aee0062f8 \
            --expected-validation-framework-commit cfb07389191540ca57c9e822b254c279ab903f36
          python verify_reproduced_results.py \
            --results-dir release_validation/v0.1.0/results \
            --expected-version 0.1.0 \
            --benchmark-repetitions 3

      - name: Verify original public v0.2.0 record
        run: |
          python verify_release_validation_record.py \
            --record-dir release_validation/v0.2.0 \
            --expected-version 0.2.0 \
            --expected-production-commit b63b6dbdde46162570dd0d17902e619467771624 \
            --expected-validation-framework-commit f48bd14048866820c7a252d935ed2d26cb9407e5
      - name: Verify independent 21 October v0.2.0 reproduction
        run: |
          python verify_release_validation_record.py \
            --record-dir release_validation/v0.2.0-reproduction-20261021 \
            --expected-version 0.2.0 \
            --expected-production-commit 65eb791d9f1a202c3ca8816332a58c036794bd1f \
            --expected-validation-framework-commit 3c64a1d367253ddcaef06c2f07012f347606358e
          python release_validation/v0.2.0-reproduction-20261021/verify_counts.py
          (cd release_validation/v0.2.0-reproduction-20261021 && sha256sum -c supplementary_checksums.sha256)
