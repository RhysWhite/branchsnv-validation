name: Publication snapshot integrity

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile validation scripts
        run: python -m compileall -q experiments verify_publication_snapshot.py
      - name: Verify committed publication snapshot
        run: python verify_publication_snapshot.py
